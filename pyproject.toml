[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-safe-route"
version = "1.0.0"
description = "Research risk scoring and joint-constrained PM routing"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "scipy>=1.10", "scikit-learn>=1.8,<1.9", "geopandas>=1.0", "pyarrow>=16", "shapely>=2", "pyproj>=3.6"]

[project.scripts]
pm-safe-route = "pmroute.cli:main"

[tool.setuptools]
packages = ["pmroute"]
